# 路径点测试文件 - 自定义轨迹
# 每个路径点包含位置(x, y)和朝向(yaw)信息
# 从机器人当前位置开始，创建自定义轨迹

path_points:
  - point:
      x: 8.0
      y: 2.0
      yaw: 0.785
    description: "第一个路径点"

  - point:
      x: 9.0
      y: 2.5
      yaw: 0.464
    description: "第二个路径点"

  - point:
      x: 10.0
      y: 3.0
      yaw: 0.464
    description: "第三个路径点"

  - point:
      x: 11.0
      y: 3.5
      yaw: 0.464
    description: "第四个路径点"

  - point:
      x: 12.0
      y: 4.0
      yaw: 0.464
    description: "第五个路径点"

  - point:
      x: 12.5
      y: 5.0
      yaw: 0.464
    description: "第六个路径点"

# 测试说明:
# 1. 这组路径点形成一条自定义轨迹
# 2. 每个路径点朝向根据轨迹方向计算，便于机器人转向
# 3. 路径点数量适中(5个)，便于观察导航过程
# 4. 轨迹从(8,2)开始，向东北方向延伸到(12,4)
